name: Build & Release APK

# Builds a real, signed **release** APK (never debug bundle) on every push from
# the native Kotlin/Jetpack-Compose project, then publishes it as a GitHub
# Release. APK only — no AAB.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---- Smart version: 1.0.<run> name, <run> code (always increasing) ----
      - name: Compute version
        id: ver
        run: |
          VNAME="1.0.${{ github.run_number }}"
          VCODE="${{ github.run_number }}"
          echo "name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "code=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Version → name=$VNAME  code=$VCODE"

      # ---- Resolve the signing keystore (stable from secrets, else debug) ----
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            KS="$RUNNER_TEMP/gauss-release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            {
              echo "GAUSS_KEYSTORE_PATH=$KS"
              echo "GAUSS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "GAUSS_KEY_ALIAS=$KEY_ALIAS"
              echo "GAUSS_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
            echo "Using stable keystore from repository secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — the release APK will be signed with the Android debug key. It installs fine, but is not upgrade-compatible across machines. Add ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD for stable signing."
          fi

      - name: Assemble release APK
        env:
          GAUSS_VERSION_NAME: ${{ steps.ver.outputs.name }}
          GAUSS_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate & rename APK
        id: apk
        run: |
          set -euo pipefail
          IN="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$IN" ]; then
            echo "Release APK not found at $IN" >&2
            find app/build/outputs -name '*.apk' || true
            exit 1
          fi
          OUT="gauss-v${{ steps.ver.outputs.name }}.apk"
          cp "$IN" "$OUT"
          ls -lh "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gauss-v${{ steps.ver.outputs.name }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Gauss v${{ steps.ver.outputs.name }}
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ### Gauss v${{ steps.ver.outputs.name }}
            اپ اندروید شخصی Gauss (Kotlin + Jetpack Compose) — APK امضاشدهٔ release.

            - `versionName`: `${{ steps.ver.outputs.name }}`
            - `versionCode`: `${{ steps.ver.outputs.code }}`

            فایل `*.apk` پایین رو دانلود و روی گوشی نصب کن.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
