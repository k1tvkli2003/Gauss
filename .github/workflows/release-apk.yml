name: Build & Release Gauss Android

# The only public Android release surface is the Flutter application under
# flutter_app/.  The root Kotlin module is retained as an explicitly named
# legacy archive and must never be published as Gauss.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauss-android-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish Flutter Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager closes stdin once every licence is accepted. With
          # pipefail enabled, that makes `yes` report a harmless broken pipe
          # and incorrectly fails the whole release job.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Allocate immutable Android version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Restore protected signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required for a releasable APK.}"
          : "${KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required for a releasable APK.}"
          : "${KEY_ALIAS:?ANDROID_KEY_ALIAS is required for a releasable APK.}"
          : "${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required for a releasable APK.}"
          KEYSTORE_PATH="$RUNNER_TEMP/gauss-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "GAUSS_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "GAUSS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "GAUSS_KEY_ALIAS=$KEY_ALIAS"
            echo "GAUSS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Resolve Flutter dependencies and quality gates
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build universal Flutter release APK
        working-directory: flutter_app
        shell: bash
        env:
          GAUSS_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GAUSS_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          flutter build apk --release --build-name "$GAUSS_VERSION_NAME" --build-number "$GAUSS_VERSION_CODE"

      - name: Verify package, version, alignment, and signing
        id: verify
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="flutter_app/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          BADGING="$($BUILD_TOOLS/aapt dump badging "$APK")"
          grep -F "package: name='com.gauss.app'" <<< "$BADGING"
          grep -F "versionCode='${VERSION_CODE}'" <<< "$BADGING"
          grep -F "versionName='${VERSION_NAME}'" <<< "$BADGING"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          SIGNATURE="$($BUILD_TOOLS/apksigner verify --verbose --print-certs "$APK")"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" <<< "$SIGNATURE"
          if grep -Fq "Android Debug" <<< "$SIGNATURE"; then
            echo "Refusing to publish an APK signed with the Android debug certificate." >&2
            exit 1
          fi
          ARTIFACT="$RUNNER_TEMP/gauss-v${VERSION_NAME}-android-universal.apk"
          CHECKSUMS="$RUNNER_TEMP/SHA256SUMS"
          cp "$APK" "$ARTIFACT"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$ARTIFACT")" > "$(basename "$CHECKSUMS")"
          )
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "checksums=$CHECKSUMS" >> "$GITHUB_OUTPUT"

      - name: Publish verified Flutter APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ARTIFACT: ${{ steps.verify.outputs.artifact }}
          CHECKSUMS: ${{ steps.verify.outputs.checksums }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Existing $TAG points to $TAG_SHA, not $GITHUB_SHA." >&2
              exit 1
            fi
            gh release upload "$TAG" "$ARTIFACT" "$CHECKSUMS" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ARTIFACT" "$CHECKSUMS" \
              --target "$GITHUB_SHA" \
              --title "Gauss v${VERSION_NAME}" \
              --notes "Flutter Android release for commit ${GITHUB_SHA}. Includes a signed universal APK and SHA-256 checksum." \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${GAUSS_KEYSTORE_PATH:-}" ] && [ -f "$GAUSS_KEYSTORE_PATH" ]; then
            rm -f "$GAUSS_KEYSTORE_PATH"
          fi
